<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <clipPath id="euroCircleClip">
      <circle cx="36" cy="36" r="34" />
    </clipPath>
    <g id="star">
      <polygon points="0,-2.6 0.8,-0.8 2.6,-0.8 1.1,0.3 1.7,2.1 0,1.0 -1.7,2.1 -1.1,0.3 -2.6,-0.8 -0.8,-0.8" fill="#ffcc00" />
    </g>
  </defs>
  <circle cx="36" cy="36" r="35" fill="#e2e8f0" />
  <g clip-path="url(#euroCircleClip)">
    <!-- Blue Background -->
    <rect width="72" height="72" fill="#003399" />
    <!-- 12 Stars of Europe -->
    <!-- Center (36, 36), radius 19 -->
    <g transform="translate(36, 36)">
      <!-- 12 o'clock -->
      <use href="#star" transform="translate(0, -18)" />
      <!-- 1 o'clock -->
      <use href="#star" transform="rotate(30) translate(0, -18)" />
      <!-- 2 o'clock -->
      <use href="#star" transform="rotate(60) translate(0, -18)" />
      <!-- 3 o'clock -->
      <use href="#star" transform="rotate(90) translate(0, -18)" />
      <!-- 4 o'clock -->
      <use href="#star" transform="rotate(120) translate(0, -18)" />
      <!-- 5 o'clock -->
      <use href="#star" transform="rotate(150) translate(0, -18)" />
      <!-- 6 o'clock -->
      <use href="#star" transform="rotate(180) translate(0, -18)" />
      <!-- 7 o'clock -->
      <use href="#star" transform="rotate(210) translate(0, -18)" />
      <!-- 8 o'clock -->
      <use href="#star" transform="rotate(240) translate(0, -18)" />
      <!-- 9 o'clock -->
      <use href="#star" transform="rotate(270) translate(0, -18)" />
      <!-- 10 o'clock -->
      <use href="#star" transform="rotate(300) translate(0, -18)" />
      <!-- 11 o'clock -->
      <use href="#star" transform="rotate(330) translate(0, -18)" />
    </g>
  </g>
  <circle cx="36" cy="36" r="34" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
</svg>
