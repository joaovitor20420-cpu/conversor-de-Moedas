    <circle cx="32" cy="43" r="0.8" fill="#ffffff" />
    <circle cx="35" cy="44" r="0.8" fill="#ffffff" />
    <circle cx="39" cy="43" r="0.8" fill="#ffffff" />
    <circle cx="41" cy="42" r="0.7" fill="#ffffff" />
