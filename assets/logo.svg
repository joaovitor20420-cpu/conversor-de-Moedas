<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" width="300" height="74" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5179e" />
      <stop offset="50%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#4361ee" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f77f00" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-end Logo Emblem with nested architecture -->
  <g transform="translate(8, 10)">
    <!-- Ambient glow -->
    <rect x="0" y="0" width="64" height="64" rx="20" fill="url(#brandGrad)" opacity="0.25" filter="url(#softGlow)" />
    
    <!-- Outer Bezel -->
    <rect x="2" y="2" width="60" height="60" rx="18" fill="#140224" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
    
    <!-- Inner Core with subtle gradient background -->
    <rect x="6" y="6" width="52" height="52" rx="14" fill="#20063b" stroke="rgba(199, 125, 255, 0.3)" stroke-width="1" />
    
    <!-- Exchange arrows and currency glyph -->
    <path d="M 24 23 C 28 17, 36 17, 40 21" stroke="#e0aaff" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <polygon points="41,19 41,24 36,22" fill="#e0aaff" />

    <path d="M 40 41 C 36 47, 28 47, 24 43" stroke="#b5179e" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <polygon points="23,45 23,40 28,42" fill="#b5179e" />

    <!-- Center Currency Symbol -->
    <text x="32" y="37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">R$</text>
  </g>

  <!-- Typography: Pure, modern, geometric -->
  <text x="86" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="21" fill="#ffffff" letter-spacing="-0.6">
    CURRENCY<tspan fill="#c77dff">X</tspan>
  </text>
  <text x="87" y="56" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="10" fill="#a78bfa" letter-spacing="2.2">
    CÂMBIO GLOBAL INTELIGENTE
  </text>
</svg>
